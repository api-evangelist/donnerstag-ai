aid: donnerstag-ai
name: Donnerstag Ai
description: >-
  Donnerstag.ai (Donnerstag.ai Technologies GmbH) is a Frankfurt-based enterprise
  fintech building an AI Reconciliation Layer for enterprise finance. Its platform
  automates financial reconciliation at the line-item level across accounts payable,
  accounts receivable, bank, and intercompany flows, adapting to each customer's
  systems, data sources, workflows, and roles. The stated goal is 100% line-item
  coverage at T+0 so the financial close becomes a confirmation rather than a
  month-end scramble, with an immutable audit trail for GoBD, IFRS, SOX, and BEPS.
  The company serves logistics, payment service providers, retail and e-commerce,
  manufacturing, human resources, and construction, is EU-hosted in Frankfurt, and
  is founded by Barbaros Ozbugutu and Volkan Ozkan and backed by Speedinvest. As a
  solution-and-services provider it exposes no public developer API, SDK, or docs.
